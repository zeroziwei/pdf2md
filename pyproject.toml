[project]
name = "pdf2md"
version = "0.1.0"
description = "PDF to Markdown conversion tool with multiple extraction engines"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "PDF2MD Contributors"}
]
license = {text = "MIT"}
keywords = ["pdf", "markdown", "ocr", "conversion", "document"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pymupdf>=1.26.7", # PDF processing
    "typer>=0.12.0", # CLI framework
    "rich>=13.0.0", # Terminal formatting and progress bars
    "pillow>=10.0.0", # Image handling
    "requests>=2.31.0", # HTTP requests for MinerU API
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.7.0",     # OCR engine with Chinese support
    "paddlepaddle>=2.5.0",  # PaddlePaddle backend
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
]
all = [
    "pdf2md[ocr,dev]",
]

[project.scripts]
pdf2md = "pdf2md.cli.main:app"

[project.urls]
Homepage = "https://github.com/yourusername/pdf2md"
Documentation = "https://github.com/yourusername/pdf2md/blob/main/README.md"
Repository = "https://github.com/yourusername/pdf2md"
Issues = "https://github.com/yourusername/pdf2md/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=pdf2md --cov-report=html --cov-report=term"

[tool.black]
line-length = 79
target-version = ['py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 79
target-version = "py313"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by black)
